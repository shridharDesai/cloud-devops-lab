name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: docker build --target test -t cloud-devops-lab:test .

      - name: Build Docker production image
        run: docker build --target production -t cloud-devops-lab:ci .
